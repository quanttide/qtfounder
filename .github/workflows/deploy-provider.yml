# 部署 provider（custom.debian12 + ZIP 代码包，无 Docker/镜像仓库依赖）：
# Go 静态编译 bootstrap → 打 ZIP（含 fiction/memory 数据快照）→ 上传 OSS → terraform apply 部署 FC。
#
# 参考 qtcloud-asset deploy-provider 模式。
#
# 所需 GitHub secrets（仓库级）：
#   - QTFOUNDER_SECRET_KEY：API 访问密钥（注入 FC 环境变量，客户端以 Bearer 携带）
#   - ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET：RAM 用户 AccessKey（OSS 上传 + terraform）

name: Deploy Provider

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/provider/**'
      - 'manifests/terraform/**'
      - '.github/workflows/deploy-provider.yml'

concurrency:
  group: deploy-provider
  cancel-in-progress: false

env:
  TF_VAR_region: cn-hangzhou
  TF_VAR_environment: prod
  TF_STATE_BUCKET: quanttide-terraform-state
  TF_STATE_KEY: qtfounder/terraform.tfstate
  OSS_CODE_BUCKET: qtcloud-asset
  OSS_CODE_OBJECT: qtfounder/provider/qtfounder-provider-go-linux-amd64.zip

jobs:
  package:
    name: Build & Upload Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout qtfounder
        uses: actions/checkout@v4

      # 数据源快照打入 ZIP（同组织私有仓库，GITHUB_TOKEN 需组织授权可读）
      - name: Checkout fiction
        uses: actions/checkout@v4
        with:
          repository: quanttide/quanttide-fiction-of-founder
          path: data/fiction

      - name: Checkout memory
        uses: actions/checkout@v4
        with:
          repository: quanttide/quanttide-context-of-founder
          path: data/memory

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build bootstrap & Package ZIP
        run: |
          mkdir -p build/provider
          cd src/provider
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../build/provider/bootstrap ./cmd/server
          cd ../..
          cp -r data build/provider/data
          cd build/provider
          zip -qr ../qtfounder-provider-go-linux-amd64.zip bootstrap data

      - name: Upload package to OSS
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          curl -L -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.2.1/ossutil-2.2.1-linux-amd64.zip
          unzip -q ossutil.zip
          OSSUTIL="$(find . -type f -name ossutil -perm -111 | head -n 1)"
          "$OSSUTIL" -i "$ALIBABA_CLOUD_ACCESS_KEY_ID" -k "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" -e oss-cn-hangzhou.aliyuncs.com --region cn-hangzhou cp -f build/qtfounder-provider-go-linux-amd64.zip oss://${OSS_CODE_BUCKET}/${OSS_CODE_OBJECT}

  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: read

    env:
      ALICLOUD_ACCESS_KEY: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALICLOUD_SECRET_KEY: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      TF_VAR_secret_key: ${{ secrets.QTFOUNDER_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'

      - name: Terraform Init（OSS 远程状态）
        working-directory: manifests/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.TF_VAR_region }}"

      - name: Terraform Plan
        working-directory: manifests/terraform
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        working-directory: manifests/terraform
        run: terraform apply -input=false -no-color tfplan

      - name: Show Trigger URL
        working-directory: manifests/terraform
        run: terraform output -raw trigger_url 2>/dev/null || true
