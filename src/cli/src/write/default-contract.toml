# 表达审计的验收标准。一份契约 = 一类介质；0 表示关闭。
#
# 与 language、docs 分工：language 管词与句，docs 管表格列表，write 管表达方式。
# 这里只收「说出来但没讲清楚」的形态：空话、口号、指路、结构。

[scope]
# 带 / 的按路径前缀算，不带的按同名文件或目录算（任意层级）
exclude = [
    ".git",
    "node_modules",
    "target",
    "_build",
    "CHANGELOG.md",
    "data/archive",
    "data/journal",
    "assets",
    "examples",
]

[empty]
# 空话：删掉不影响意思，或需要说清具体指什么。
# 按整篇密度判，不逐句报——单个词出现一次可能只是正常用法。
words = [
    "等等",
    "一些",
    "各种",
    "进一步",
    "不断",
    "持续",
    "有效",
    "充分",
    "切实",
    "全面",
    "深入",
    "大力推进",
    "赋能",
    "抓手",
    "闭环",
    "沉淀",
    "对齐",
    "拉通",
    "打通",
    "组合拳",
    "打法",
    "心智",
    "势能",
]
# 每千字命中上限；低于它不报
max_per_1000 = 6
# 文档低于这个字数不判
min_chars = 300
advice = "删掉，或说清具体指什么；空话不承担信息"

[slogan]
# 口号句式：先否定再肯定、只给条件不给反例、用递进代替论证。
[[slogan.patterns]]
pattern = '不是.{1,20}而是'
advice = '拆成两句：先说什么不对，再说什么对，各给一句理由'

[[slogan.patterns]]
pattern = '只有.{1,20}才'
advice = '补上条件和反例；没有反例的条件多半是口号'

[[slogan.patterns]]
pattern = '越.{1,12}越'
advice = '说清两头各是什么，再给中间的量；只写趋势等于没写'

[[slogan.patterns]]
pattern = '既要.{1,30}又要'
advice = '拆成两条，给出优先级；都要等于没排序'

[[slogan.patterns]]
pattern = '说到底|本质上|说白了'
advice = '删掉，直接给判断'

[[slogan.patterns]]
pattern = '一句话[：:]'
advice = '把一句话展开成定义、步骤与边界'

[[slogan.patterns]]
pattern = '由此可见|综上|总之'
advice = '删掉总结句，用一条可检验的结论收尾'

[reference]
# 正文里让读者去看另一份文档。读者拿不到那份文档时，这句话就断了。
patterns = [
    '见\s*[^，。；\s]+\.md',
    '参见',
    '详见',
    '参考\s*[^，。；\s]+\.md',
    '见《',
    '如前所述',
    '见上文',
    '见下文',
]
advice = '把结论写进正文；路径只留一句去处，不代替论证'

[structure]
# 结构：一级标题、标题层级、长文分节。
require_heading = true
# 一篇允许的一级标题数
max_h1 = 1
# 标题一次最多降几级
max_heading_jump = 1
# 超过这个字数还没有二级标题，报「一段到底」
min_chars_per_section = 500
