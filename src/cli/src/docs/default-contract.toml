# 文档结构审计的验收标准。一份契约 = 一类介质；0 表示关闭。

[scope]
# 带 / 的按路径前缀算，不带的按同名文件或目录算（任意层级）
# 2026-10-25 巡检：格式类错误 620 处里只有 46 处在活文档，其余来自归档、小说原稿、实验仓。
# 与 language 契约对齐：这几处不是按正式文档标准写的，不该按正式文档要求。
exclude = [
    ".git",
    "node_modules",
    "target",
    "_build",
    "CHANGELOG.md",
    "data/archive",
    "data/journal",
    "assets",
    "examples",
]

[table]
# 表格本身是认知负担：手机上要横滚、单元格里塞段落、一张表混几个维度。
max_columns = 5          # 列太多要横滚
max_cell_chars = 40      # 单元格塞段落 = 该拆成正文
max_rows = 15            # 行太多 = 该拆表或转列表
require_header = true    # 第二行必须是分隔行（|---|），否则读者不知道每列是什么
# 滥用信号：问题往往不是「表格长什么样」，是「这段内容根本不需要表格」。
flag_two_column = true           # 两列表本质是名词解释，列表更自然
min_rows = 2                     # 数据行少于这个数，等于一句「A 是 B」
sparse_ratio = 0.3               # 空单元格超过这个比例，说明内容撑不起这个形状
layout_headers = ["说明", "备注", "内容", "描述", "要点", "备注说明", "示例", "例子"]

[list]
# 三项以下不算结构块；单条与两条本来就是一句话。
min_items = 3
# 单项超过这个字数：本该是段落。
max_item_chars = 100
# 「加粗要点 + 解释」占列表项的比例上限。这是 AI 生成列表最稳定的指纹。
label_ratio = 0.7

[density]
# 阈值待标定：先跑 `qtfounder docs <目录> --stats`，把两组语料的数字摆出来再回填。
# 0 = 关闭，也意味着「只观测不判定」。
max_block_ratio = 0.0
max_run_ratio = 0.0
# 多长的段落才算把两串结构块隔开；0 表示任何段落都算。
min_paragraph_chars = 30
# 文档总字数低于它就不判，避免拿短文档下结论。
min_chars = 500

[bold]
# 加粗是重点标记，满篇重点等于没有重点。三件可数的事：每千字几处、一行几处、一处几个字。
# 0 = 关闭对应规则。
max_per_1000 = 12        # 每千字加粗处数上限
max_per_line = 1         # 一行并列加粗的处数上限
max_span_chars = 30      # 一处加粗的字数上限，超过就是把整句加粗了
min_chars = 300          # 文档低于这个字数不算密度

[rule]
# 分章靠标题，横线不承担结构。
max = 3                  # 全文分割线处数上限；0 = 关闭
flag_between_sections = true   # 紧挨标题的横线只是装饰，单独报

[frontmatter]
# 文件头那几行 YAML。没有 front matter 的文档不管，有就按下面两张表查。
# keys 之外的字段报嫌疑：字段名先写进契约，别各写各的。
keys = ["name", "description", "author", "status"]
# 谁写的。agent = AI 起草，human = 人写的。
author = ["agent", "human"]
# 说到哪一步了。三档都在往下走，不循环。
#   draft   草稿：还在写，随时会变
#   pending 待验证：写完了，说法未核，不能当定论引用；AI 起草的默认落这里
#   final   定稿：已验证，可以引用
# 同一个意思不另造近义词：「待验证」「悬疑」「疑惑」不属于状态，
# 前两个是待验证的具体原因，第三个该退回 draft 重写。
status = ["draft", "pending", "final"]
