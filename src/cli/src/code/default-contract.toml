domain = "code"

# 代码语用的默认契约：四层验收标准的阈值与词表。
#
# 这是本工具自带的契约（software engineering contract）：它规定「什么样的代码算合格」。
# 改口径只改这里，不碰代码；项目可以 `--rules my-contract.toml` 换成自己的契约。
# 契约随代码走，放在代码资源里，与运行期数据分开。

[scope]
# 归档代码与示例代码不审：2026-10-22 实测，全仓四百二十二处里三百一十三处落在这些目录。
# 与 language、docs 两份契约的 exclude 对齐。
exclude = ["target", ".git", "node_modules", "build", "dist", "archive", "examples"]

[lexical]
# 信息量不足的万能名：叫这些名字的，读者必须回头读代码才知道装的是什么
vague_names = ["data", "temp", "tmp", "flag", "val", "value", "res", "obj", "info", "thing", "stuff", "foo", "bar"]
min_len = 3
# 短名白名单：行业里只有一个读法的缩写，不算「读者要猜」
whitelist = ["id", "db", "os", "io", "re", "ai", "ui", "tz", "ts", "ok", "ms", "el", "it", "fp", "fs", "fn", "kv", "ex", "ev", "ci", "cd", "to", "of", "is", "in", "on", "by", "or", "up", "i", "j", "k", "x", "y", "z", "a", "b"]
# 缩写至少两种读法：团队没有唯一约定时读者会读错
abbreviations = { ctx = "context", cfg = "config", msg = "message", req = "request", resp = "response", err = "error", buf = "buffer", cnt = "count", idx = "index", ptr = "pointer", src = "source", dst = "destination", attr = "attribute", arg = "argument", param = "parameter", impl_ = "implementation", spec = "specification" }
# 同一个动作多种说法：一组里出现三种以上就报
synonym_groups = [
  ["get", "fetch", "load", "read", "query", "retrieve"],
  ["save", "store", "persist", "write", "put"],
  ["make", "create", "build", "generate", "construct"],
  ["delete", "remove", "drop", "clear", "purge"],
  ["check", "validate", "verify", "ensure", "assert"],
]

[syntax]
max_depth = 3
max_function_lines = 60
max_params = 5
max_cognitive = 15
max_chain = 4

[module]
max_top_defs = 15
max_methods = 15

[pragmatic]
error_msg_min_chars = 12
missing_why_lines = 25
# 只说了动作没说对象的名字：读者必须回头读代码才知道装的是什么
uninformative_names = ["handle", "process", "do_it", "run", "exec", "execute", "work", "deal", "manage", "util", "utils", "helper", "helpers", "func", "stuff"]
# 错误信息里出现这些词，才说明它告诉了读者下一步做什么
action_words = ["请", "检查", "应该", "必须", "不能", "需要", "配置", "传入", "指定", "重试"]
