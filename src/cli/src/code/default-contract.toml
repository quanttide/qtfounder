domain = "code"

# 代码语用的默认契约：四层验收标准的阈值与词表。
#
# 这是本工具自带的契约（software engineering contract）：它规定「什么样的代码算合格」。
# 改口径只改这里，不碰代码；项目可以 `--rules my-contract.toml` 换成自己的契约。
# 契约随代码走，放在代码资源里，与运行期数据分开。

[scope]
# 归档代码与示例代码不审：2026-10-22 实测，全仓四百二十二处里三百一十三处落在这些目录。
# 与 language、docs 两份契约的 exclude 对齐。
exclude = ["target", ".git", "node_modules", "build", "dist", "archive", "examples"]

[lexical]
# 信息量不足的万能名：叫这些名字的，读者必须回头读代码才知道装的是什么
vague_names = ["data", "temp", "tmp", "flag", "val", "value", "res", "obj", "info", "thing", "stuff", "foo", "bar"]
min_len = 3
# 短名白名单：行业里只有一个读法的缩写，不算「读者要猜」
whitelist = ["id", "db", "os", "io", "re", "ai", "ui", "tz", "ts", "ok", "ms", "el", "it", "fp", "fs", "fn", "kv", "ex", "ev", "ci", "cd", "to", "of", "is", "in", "on", "by", "or", "up", "i", "j", "k", "x", "y", "z", "a", "b"]
# 缩写至少两种读法：团队没有唯一约定时读者会读错
abbreviations = { ctx = "context", cfg = "config", msg = "message", req = "request", resp = "response", err = "error", buf = "buffer", cnt = "count", idx = "index", ptr = "pointer", src = "source", dst = "destination", attr = "attribute", arg = "argument", param = "parameter", impl_ = "implementation", spec = "specification" }
# 同一个动作多种说法：一组里出现三种以上就报
synonym_groups = [
  ["get", "fetch", "load", "read", "query", "retrieve"],
  ["save", "store", "persist", "write", "put"],
  ["make", "create", "build", "generate", "construct"],
  ["delete", "remove", "drop", "clear", "purge"],
  ["check", "validate", "verify", "ensure", "assert"],
]

[syntax]
max_depth = 3
max_function_lines = 60
max_params = 5
max_cognitive = 15
max_chain = 4

[module]
max_top_defs = 15
max_methods = 15

[pragmatic]
error_msg_min_chars = 12
missing_why_lines = 25
# 只说了动作没说对象的名字：读者必须回头读代码才知道装的是什么
uninformative_names = ["handle", "process", "do_it", "run", "exec", "execute", "work", "deal", "manage", "util", "utils", "helper", "helpers", "func", "stuff"]
# 错误信息里出现这些词，才说明它告诉了读者下一步做什么
action_words = ["请", "检查", "应该", "必须", "不能", "需要", "配置", "传入", "指定", "重试"]

# ---------------- 反思 ----------------
# 完成一个任务后照这份清单看一遍当前架构。找的是正在一边长的缺陷，不是语法与风格。
# 每条给三层：description（看什么）、why（为什么它算缺陷）、example（具体长什么样）。
# `qtfounder code reflect` 打这四条，`code reflect --example` 连 example 一起打。
# 顺序即优先级：先看有没有无主的行，再看不确定项与边界，最后看框架。

[[reflect]]
name = "unmarked-additions"
description = "这次改动里，有没有哪一行不是你要求的，也没写进意图的哪一层。"
why = "对不上意图的行将来没人敢删，删了也不知道会塌什么。"
example = "本来说只加一个导出，模型顺手把老的导入分支也重构了，意图里没写——那半截就是无主的。"

[[reflect]]
name = "unresolved-piling"
description = "意图声明的不确定项，这次加了几条、解了几条。"
why = "不确定只增不减，重构就是往不确定上叠新代码。"
example = "axiom 归域那轮，「print_layer 改名会不会波及 asset 侧」当场验掉了；同类问题连着三条没人验，就是堆积。"

[[reflect]]
name = "boundary-creep"
description = "这次改动有没有落在意图声明写「不干」的范围里。"
why = "边界是一次一次挪出来的，没人记就等于它不存在。"
example = "标着「只读、不落盘」的 JournalRepository，哪天悄悄多出一个 save——边界已经挪了，声明还写着不干。"

[[reflect]]
name = "patch-over-framework"
description = "这次是把现有框架加固了，还是在框架外面又补了一块。"
why = "路线图记的方向输入就是「现有框架渐跟不上」；补丁摞补丁，框架永远跟不上。"
example = "排除目录本该契约里一处定，三份检查器各写各的——先对齐 exclude，再加新检查。"

# ---------------- 审查 ----------------
# `code review` 打这份。审查是意图驱动编程的反向流程：从代码反推写它时的意图，
# 再看代码还对不对得上。交付物是一份报告，不是过程记录。
# 与反思（[[reflect]]）分工：反思看「这轮干完多了什么缺陷」，审查看「这段代码还对不对得上意图」。
# 与重构（Skill code-refactor）的关系：审查出偏移，重构按意图重写，两边用同一套五层意图。

[[review]]
name = "conclusion-first"
description = "报告开头一到三句说结论：最可能的意图、整体偏移程度、最该先处理的一件事。"
why = "读的人先要一个判断，才知道要不要往下看清单。"
example = "核心意图疑为「把用户输入翻译成 API 调用序列」，但混入了重试与鉴权，与声明的边界矛盾；建议先拆出重试。"

[[review]]
name = "anchor-required"
description = "每条发现带 file:line 锚点；写不出锚点就不写。"
why = "没有锚点的发现没法核，等于把猜测当结论递出去。"
example = "重试逻辑散落在调度器内 — src/planner.rs:88"

[[review]]
name = "one-finding-per-item"
description = "一条一个发现，不嵌套，不把几个问题塞进一条。"
why = "一条挂几个问题，改的时候只能挑着改，剩下的自然烂掉。"

[[review]]
name = "severity-sorted"
description = "按严重度排，只列高价值的若干条，其余归入其他。"
why = "清单一长，重要的就沉到底没人看。"

[[review]]
name = "candidates-not-verdicts"
description = "只给候选解释与偏移线索，判定归人。"
why = "模型会过度合理化，给每个奇怪的地方都编一个像样的解释；还原得成不成立，人说了算。"

[[review]]
name = "no-process"
description = "不粘贴 git 日志，不复述模型的逐条推测，不写过程旁白。"
why = "交付物是报告，扫描、git、考古都是脚手架，脚手架不进报告。"
