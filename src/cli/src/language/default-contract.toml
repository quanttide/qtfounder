# 文字审计的默认契约：六类验收标准的阈值与词表。
#
# 这是本工具自带的契约：它规定「什么样的文字算合格」。
# 改口径只改这里，不碰代码；项目可以用 --rules my-contract.toml 换成自己的契约。
# 与 code 的契约同构：一份契约 = 一类介质的验收标准。

# 文字审计规则表（规则引擎的输入）。
#
# 治的病：滥用自造术语、不用用户的词、起名随意、数字没有分母与来源、落点乱放。
# 与 secrets.toml / skills.toml 同构：规则是数据，引擎是代码。
#
# 纪律：
#   1. banned 只收「用户从没这么说过、我造出来的词」，每条给替代写法；
#   2. required 按目录类别给「必须出现的体系词」——防我用自造词把用户的词挤掉；
#   3. numbers 只报嫌疑（数字后没有分母或来源），不判定对错；
#   4. placement 优先于一切：文件放错目录，改十个词都没用。

[scope]
# 默认只审「会被反复读的规范文档」。一次性记录（当时的陈述）不进默认审计——
# 改了它们等于篡改事实，而且会天天报几千条，报了没人看，判据就失效了。
# data/profile 是用户的文风基准（他怎么说话），审它是查「我写进去的话有没有黑话」，不是改他的用词。
# 判不了某句话是谁写的就别改：机判不了，人判一次。
include_default = ["docs", "data/profile", "data/brochure", "data/roadmap", "data/insight"]
exclude = [".git", "_build", "__pycache__", "node_modules", "data/archive", "data/journal", "data/report", "examples", "assets"]

[banned]
# 入库三条件（全满足才收）：
#   ① 我造过——有具体文件:行作证；
#   ② 用户从没这么说过——在 data/profile 与章程里零命中（`qfa words` 机查）；
#   ③ 有替代写法——他的口径里对应哪个词；没有对应就写「实现细节，不进正文」。
# 出库一条：用户开始用这个词 → 立刻移出（「交付物」就是这么出库的）。
# evidence 写「哪次、在哪、用户当时怎么说」，没有出处的词只能标「自造，待核」。

[banned."不变式"]
advice = "法理条款"
evidence = "2026-10-21 六份规格通篇用它；用户当时说的词是「法理」"

[banned."元规格"]
advice = "拆开：条款进 Specification，为什么这样成立进 Essay"
evidence = "2026-10-21 抽配置驱动那份时自造，用户无此说法"

[banned."薄壳"]
advice = "实现细节，不进正文"
evidence = "2026-10-21 自造（源自「壳要薄」的口语化），用户无此说法"

[banned."能力层"]
advice = "实现细节，不进正文"
evidence = "2026-10-21 自造，用户无此说法"

[banned."接手人"]
advice = "读者"
evidence = "2026-10-21 写「写作即交接」时自造，用户无此说法"

[banned."一处正本"]
advice = "正本"
evidence = "2026-10-21 自造；用户自己的说法是「正本」"

[banned."派生物"]
advice = "副本或缓存"
evidence = "2026-10-21 自造，用户无此说法"

[banned."信息项"]
advice = "只作参考，不作违规"
evidence = "2026-10-21 自造（写体量口径时），用户无此说法"

[banned."元判据"]
advice = "法理条款"
evidence = "2026-10-21 自造，用户无此说法"

[banned."判据"]
advice = "验收标准"
evidence = "2026-10-22 用户：判据这个词我就不爱用，我比较喜欢用验收标准"

[banned."落活动"]
advice = "怎么用在一个活上"
evidence = "2026-10-21 自造（规格里的小节名），用户无此说法"

[required]
# 目录 → 该目录文档必须出现的用户体系词（任一命中即算）
# 规格体裁已取消（2026-10-21 全部删除），不再有 docs/specification 这条
"docs/essay" = ["法理"]
"docs/gallery" = ["错法", "判例"]
"docs/bylaw" = ["授权", "权责"]

[placement]
# 落点纪律：按 20 类资产章程（data/＝陈述型，docs/＝程序型）
banned_paths = { "data/essay" = "Essay 属程序型记忆，落 docs/essay/", "data/note" = "note 不在 20 类资产里，落 docs/essay/note/", "data/specification" = "没有独立的规格体裁：判据进规则表或判例，不留规格目录" }

[voice]
# 语用层：这段是不是在跟读者说话。
# 判据不是「有没有专业词」——是「内部标识符密度」加「有没有对读者指代」。
# 一段里全是我当时的操作代号、又没有任何一句指向读者，读者就只能旁观。
max_internal_ids = 3        # 一段里不同内部标识符超过几个就报
reader_words = ["你", "读者", "接手", "拿走", "用得上", "对你有用", "你能", "你会", "他要", "需要知道"]

[syntax]
# 句法层。每一项 0 = 关闭。阈值都从实测来，不凭感觉定。
#
# max_sentence_chars：抽检一篇 6,990 汉字的文档，104 句超 60 字、最长 512 字，四类审计零命中。
max_sentence_chars = 60
# 分级：超过这条线算 error（真该改），只超上面那条算嫌疑。
# 线的来源是他自己的文字：profile 四份实测句长 p50=30、p90=56、p99=101、max=122。
# 拿 60 当唯一线会把他自己认可的文字也报成问题（6.9% 的句子超 60 字）。
max_sentence_error_chars = 100
# max_de_chain：一句里「的」超过几个算长定语链。中文长定语是主要认知负担来源。
max_de_chain = 3
# max_commas：一句里逗号超过几个算一逗到底（该断句或改列表）。
max_commas = 5
# max_nominal：一句里「度／性／化／式／主义」结尾的名词化词超过几个算抽象堆叠。
max_nominal = 3
# max_paragraph_chars：单段汉字超过多少算长段（手机约三段屏）。
max_paragraph_chars = 300

[table]
# 表格本身是认知负担：手机上要横滚、单元格里塞段落、一张表混几个维度。
# 这不是「排除在句子检查之外」就完了——表格要单独检。0 = 关闭。
max_columns = 5          # 列太多要横滚
max_cell_chars = 40      # 单元格塞段落 = 该拆成正文
max_rows = 15            # 行太多 = 该拆表或转列表
require_header = true    # 第二行必须是分隔行（|---|），否则读者不知道每列是什么
# 滥用信号：问题往往不是「表格长什么样」，是「这段内容根本不需要表格」。
# 判据：需要横向对照（同一属性在多个对象间比）才用表；只是「名词 + 一段解释」用列表。
flag_two_column = true           # 两列表本质是名词解释，列表更自然
min_rows = 2                     # 数据行少于这个数，等于一句「A 是 B」
sparse_ratio = 0.3               # 空单元格超过这个比例，说明内容撑不起这个形状
long_cell_chars = 25             # 一格超过这个字数就是段落，不是值
layout_headers = ["说明", "备注", "内容", "描述", "要点", "备注说明", "示例", "例子"]

[numbers]
# 数字后面该有的东西：分母、来源、可复核的坐标
# 分母是「模式」不是词：单写「共」会把「一共改了 22 处」误判成有分母（实测踩过）
denominator_patterns = ['/共\\s*\\d', '共\\s*\\d+\\s*(处|条|份|个|份文件)', '占\\s*\\d', '\\d+\\s*/\\s*\\d+', '其中\\s*\\d', '分母', 'N\\s*/\\s*M']
source_words = ["实测", "见 ", "（", "git ", "grep", "qfh ", "docs/", "data/", "session", "报告"]
# 这些单位必须能追到分母
units = ["%", "处", "次", "条", "份", "行", "字符", "字节"]

[definitions]
# 术语首次出现必须在本文件里有定义（同句或同节出现这些字就算定义了）
define_words = ["是", "指", "＝", "=", "即"]
