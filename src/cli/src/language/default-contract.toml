domain = "language"

# 文字审计的默认契约：六类验收标准的阈值与词表。
#
# 这是本工具自带的契约：它规定「什么样的文字算合格」。
# 改口径只改这里，不碰代码；项目可以用 --rules my-contract.toml 换成自己的契约。
# 与 code 的契约同构：一份契约 = 一类介质的验收标准。

# 文字审计规则表（规则引擎的输入）。
#
# 治的病：滥用自造术语、不用用户的词、起名随意、数字没有分母与来源、落点乱放。
# 与 secrets.toml / skills.toml 同构：规则是数据，引擎是代码。
#
# 纪律：
#   1. banned 只收「用户从没这么说过、我造出来的词」，每条给替代写法；
#   2. required 按目录类别给「必须出现的体系词」——防我用自造词把用户的词挤掉；
#   3. numbers 只报嫌疑（数字后没有分母或来源），不判定对错；
#   4. placement 优先于一切：文件放错目录，改十个词都没用。

[scope]
# 审哪些文件不再由工具内嵌的目录名单决定，由你传给命令的 root 决定。
# 2026-10-22 前这里写着五个目录名（docs、data/profile、data/brochure、data/roadmap、data/insight），
# 那是把仓的章程抄进了工具：仓的布局一换（如 categories/quanttide-handbook 的 domains/、default/），
# 名单就全部落空，命令审 0 个文件、打一句「没有命中」，看上去像通过。
#
# 现在：
#   - include_default 为空 = 不挑目录，root 下所有 markdown 都收（只减 exclude）；
#   - exclude 是「不是给人读的」：流水、报告、归档、示例、第三方依赖，默认就跳过；
#   - --scope all 连 exclude 也不放过，真正的全量。
# 仓要缩到某个体裁，由仓自己的契约填 include_default（--rules 或 QTFOUNDER_LANGUAGE_CONTRACT）。
#
# 2026-10-22 用户：除了 assets/fiction 与 assets/blog，其余全是 AI 写的——data/profile、docs/essay/fiction
# 都在内。所以「他自己也在用」只能拿手写的那两处量（`--pool assets`），不能拿数据档案量。
include_default = []
# 带 `/` 的条目按路径前缀算；不带的按同名文件或目录算（任意层级）。
# CHANGELOG.md 是变更日志，不是给人反复读的规范文档：2026-10-22 实测，两份日志占了全仓文字命中的 73 处。
exclude = [".git", "_build", "__pycache__", "node_modules", "CHANGELOG.md", "data/archive", "data/journal", "data/report", "examples", "assets"]

[banned]
# 入库三条件（全满足才收）：
#   ① 我造过——有具体文件:行作证；
#   ② 用户从没这么说过——在 assets/fiction 与 assets/blog（他手写的十一万字）里零命中；
#   ③ 有替代写法——他的口径里对应哪个词；没有对应就写「实现细节，不进正文」。
# 出库一条：用户开始用这个词 → 立刻移出（「交付物」就是这么出库的）。
# evidence 写「哪次、在哪、用户当时怎么说」，没有出处的词只能标「自造，待核」。
#
# contexts 写这个词属于哪个语境。文件头声明 `context: finance` 时，标了 finance 的词就不再报：
# 财务报表写「记账」是本职，小说里写才是借词。没声明的文件按跨语境算，照报。

[banned."不变式"]
advice = "约束"
evidence = "2026-10-21 六份规格通篇用它；2026-10-22 用户：法理也不是该用的——契约这一层讲的是双方共同维护的那条线，叫约束"

[banned."元规格"]
advice = "拆开：条款进 Specification，为什么这样成立进 Essay"
evidence = "2026-10-21 抽配置驱动那份时自造，用户无此说法"

