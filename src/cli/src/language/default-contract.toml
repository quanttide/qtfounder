[required]
# 目录 → 该目录文档必须出现的用户体系词（任一命中即算）
# 规格体裁已取消（2026-10-21 全部删除），不再有 docs/specification 这条
"docs/essay" = ["法理"]
"docs/gallery" = ["错法", "判例"]
"docs/bylaw" = ["授权", "权责"]

[placement]
# 落点纪律：按 20 类资产章程（data/＝陈述型，docs/＝程序型）
banned_paths = { "data/essay" = "Essay 属程序型记忆，落 docs/essay/", "data/note" = "note 不在 20 类资产里，落 docs/essay/note/", "data/specification" = "没有独立的规格体裁：验收标准进规则表或判例，不留规格目录" }

[voice]
# 语用层：这段是不是在跟读者说话。
# 报不报不是看「有没有专业词」——是看「内部标识符密度」加「有没有对读者指代」。
# 一段里全是我当时的操作代号、又没有任何一句指向读者，读者就只能旁观。
max_internal_ids = 3        # 一段里不同内部标识符超过几个就报
# 列举段豁免：一段里反引号标识符到几个就当「读者来查的东西」，不再要求它跟读者说话。
# API 参考、参数表、字段表都是这个形状；原来这类段落一条不落地被报，只能人判一次。
min_listed_ids = 4
reader_words = ["你", "读者", "接手", "拿走", "用得上", "对你有用", "你能", "你会", "他要", "需要知道"]

[syntax]
# 句法层。每一项 0 = 关闭。阈值都从实测来，不凭感觉定。
#
# max_sentence_chars：抽检一篇 6,990 汉字的文档，104 句超 60 字、最长 512 字，四类审计零命中。
max_sentence_chars = 60
# 分级：超过这条线算 error（真该改），只超上面那条算嫌疑。
# 线的来源是他自己的文字：profile 四份实测句长 p50=30、p90=56、p99=101、max=122。
# 拿 60 当唯一线会把他自己认可的文字也报成问题（6.9% 的句子超 60 字）。
max_sentence_error_chars = 100
# max_de_chain：一句里「的」超过几个算长定语链。中文长定语是主要认知负担来源。
max_de_chain = 3
# max_commas：一句里逗号超过几个算一逗到底（该断句或改列表）。
max_commas = 5
# max_nominal：一句里「度／性／化／式／主义」结尾的名词化词超过几个算抽象堆叠。
max_nominal = 3
# max_paragraph_chars：单段汉字超过多少算长段（手机约三段屏）。
max_paragraph_chars = 300
# 把结论推回给读者的收尾：由你定、由你判断。
# 实测：他自己的 profile 与 docs 各 0 处，是我写稿时的口气，不是他的说法。
push_to_reader_patterns = ['由你(定|决定|判断|拍板|来定|挑|选|做主)']
# 先报件数再罗列：「工具判不了三件事：A、B、C」。件数本身不是信息，后面那串条目才是。
# 2026-10-22 他说这类全是我写的，他讨厌这个写法——不区分「数条目」还是「给事情命名」，一律报。
count_then_list_patterns = ['[0-9一二三四五六七八九十百两几每]\s*件(?:事)?']

[numbers]
# 数字后面该有的东西：分母、来源、可复核的坐标
# 分母是「模式」不是词：单写「共」会把「一共改了 22 处」误判成有分母（实测踩过）
# 单引号是 TOML 字面量，反斜杠不再转义：这里写 \s 就是正则的 \s。
# （2026-10-22 修：原来写成 \\s，编译出来要求字面反斜杠，七条分母模式一条都不生效。）
denominator_patterns = ['共\s*\d', '占\s*\d', '\d+\s*/\s*\d+', '其中\s*\d', '分母', 'N\s*/\s*M', '\d{4}-\d{2}-\d{2}']
# 出处词。原来有全角左括号「（」——中文带括号解释的句子太多，几乎每行都被当成有出处，等于把这一层废掉，2026-10-22 去掉。
source_words = ["实测", "见 ", "git ", "grep", "qfh ", "docs/", "data/", "session", "报告", ".md", "assets/"]
# 只有论据数字（百分比、总数计数）要求分母与出处；阈值、上限、序数、估算、区间不在此列。
units = ["%", "处", "次", "条", "份", "行"]

[definitions]
# 术语首次出现必须在本文件里有定义（同句或同节出现这些字就算定义了）
define_words = ["是", "指", "＝", "=", "即"]
