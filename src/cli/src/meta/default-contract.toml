# 归位的判定标准。一份内容只有一个正确去处。
#
# 判定顺序：先定域（留在这里，还是去领域仓），再定格（十八格之一），
# 再看够不够格（升格、降格、不收），最后给写法。
# 判定层只读这份文件：词表、界线、骨架都在这里，改规则改文件，不改代码。

[verdict]
# 分差低于它，判待定，先问一句；打平就判不了，差一分算有倾向。
min_margin = 1
# 一格都没命中，不收：一句都套不上的，留在日志里等它重复。
min_hits = 1
# 领域命中数低于它，不指路：一个顺带动词不该把整篇搬去别的领域。
min_domain_hits = 2
# 留在这里的说法。
stay = "留在这里"
# 正文出现这些词，搬去领域侧时按归档处理：只移动文件，不改写内容。
# 没出现就是移交：按目标侧的体例重写。
archive_cues = ["已废弃", "旧版", "已过期", "停止维护", "作废"]
# 判不了、又没有现成分辨句时，问这一句。
question_fallback = "它说的是世界怎么运转，还是你下一步要做什么？前者归认知类，后者归方向类。"
# 超过这么多段，说明给的是一篇材料而不是一条线索：
# 一次判一篇，各条的线索会互相干扰，宁可让拆开再判。
max_paragraphs = 5

# ---------------- 域 ----------------
# 判域只看正文，不看它现在住在哪。没命中任何领域，就是留在这里。
# 名字与 domains/ 下的仓库一一对应；换领域改这里。

