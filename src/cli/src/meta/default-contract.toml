# ---------------- 降格 ----------------
# 名义上进了某格、但过不了准入的，往下一格走，并说明理由。

[[transition]]
from = "specification"
to = "essay"
require_any = ["大概", "估计", "约", "待标定", "凭感觉"]
lack_any = ["数据", "实测", "样本", "统计"]
reason = "阈值没有出处，先进论文，等它被验证再升格。"

[[transition]]
from = "handbook"
to = "gallery"
require_any = ["那次", "当天", "参与人"]
reason = "换一个实例就散架，是案例不是手册。"

[[transition]]
from = "insight"
to = "essay"
require_any = ["推不翻", "自指", "无法验证", "观察自己"]
reason = "推不翻也改不了做法，适合进论文，不进洞察。"

# ---------------- 判不了时问哪一句 ----------------
# 一次只问一个，问完就停。两边都像时按这里的分辨句问。

[[question]]
pair = ["insight", "roadmap"]
ask = "这句话在解释为什么必须这样排（因为…否则…），还是现在就要做哪一步？前者进洞察，后者进路线图。"

[[question]]
pair = ["insight", "profile"]
ask = "这是能一次事件推翻的一句话，还是跨事稳定的判断方式？前者进洞察，后者进档案。"

[[question]]
pair = ["insight", "essay"]
ask = "它给得出数据、判得出对错吗？给得出进洞察，给不出进论文。"

[[question]]
pair = ["journal", "insight"]
ask = "抽掉日期和当事人，这句话还成立吗？成立进洞察，不成立留日志。"

[[question]]
pair = ["journal", "report"]
ask = "这一轮结束了吗？结束了进报告，还在发生的留日志。"

[[question]]
pair = ["insight", "specification"]
ask = "这是一句能被推翻的机制，还是必须满足的验收要求？前者进洞察，后者进规格。"

[[question]]
pair = ["intention", "roadmap"]
ask = "这是「我要 X 不要 Y」的原话，还是已经定下的先后？原话进愿景，定了的进路线图。"

[[question]]
pair = ["intention", "essay"]
ask = "这是你要的对齐原话，还是在解释一套道理？原话进愿景，讲道理进论文。"

[[question]]
pair = ["insight", "intention"]
ask = "同一句话，是能对错的机制，还是给 AI 的指令？前者进洞察，后者进愿景。"

[[question]]
pair = ["intention", "profile"]
ask = "这是「我要什么」，还是「我是什么样的人」？要什么会随事变，是什么样的人不随事变。"

[[question]]
pair = ["laboratory", "platform"]
ask = "这是在验证一个还没定的做法，还是已经能长期交付的能力？前者留实验室跑，后者升进正式入口，实验室不留复制件。"

[[question]]
pair = ["handbook", "gallery"]
ask = "换一个实例还成立吗？成立进手册，只有那一次成立进案例。"

[[question]]
pair = ["bylaw", "specification"]
ask = "这条要人签字放行才生效吗？是章程，不是规格。"

[[question]]
pair = ["specification", "essay"]
ask = "概念定义稳定、阈值有数据吗？都有进规格，否则进论文。"

# ---------------- 本体 ----------------
# 模型描述两族九宫格的轴；公理是归位时不重新论证的前提。
# 两者都不参与算分：模型只描述轴，公理只在落位卡上点名出处；判断仍看 [[cell]]、[[transition]] 与 [[question]]。

[model]
description = "一份内容只有一个正确去处。十八格分两族，各成九宫格。"

[[model.family]]
name = "陈述型"
question = "组织知道什么"
description = "过去是已履行的契约，现在是正在履行的，未来是将要履行的。"

[[model.family.axis]]
name = "时间"
values = ["过去", "现在", "未来"]

[[model.family.axis]]
name = "类型"
values = ["事件", "语义", "自我"]

[[model.family]]
name = "程序型"
question = "组织怎么做事"
description = "宪法定权责，法律写程序，法理讲方法论。"

[[model.family.axis]]
name = "约束力"
values = ["宪法", "法律", "法理"]

[[model.family.axis]]
name = "消费对象"
values = ["人读", "AI 解析", "直接运行"]

[[axiom]]
name = "one-place"
description = "一份内容只有一个正确去处。"
why = "放错格的代价不是难看，是下一轮没人找得到它。"
status = "suspected"

[[axiom]]
name = "domain-before-cell"
description = "先定域，再定格，再过准入，最后给写法。"
why = "顺序换了，域错时格越准，搬得越远。"
status = "suspected"

[[axiom]]
name = "text-only"
description = "只看正文，不看它现在住在哪。"
why = "现在的位置可能是上一次判错留下的。"
status = "suspected"

[[axiom]]
name = "no-fit"
description = "一格都套不上就不收，留在日志里等它重复。"
why = "硬归进某一格，只会让那一格多一条没人再看的记录。"
status = "suspected"

[[axiom]]
name = "one-source"
description = "同一内容只在一处完整展开，其余留一句互链。"
why = "两处都写同一个事实，就是两个真源。"
status = "suspected"

[[axiom]]
name = "no-fallback"
description = "契约缺了就停手，不内置兜底。"
why = "静默回退会让人以为规则生效了。"
status = "suspected"

[[axiom]]
name = "target-then-source"
description = "迁移先写目标、再删源，源侧不留复制件。"
why = "窗口里不能两边都空；完成后也不能两边都有。"
status = "suspected"

[[axiom]]
name = "archive-vs-transfer"
description = "归档只移动不改写；移交必须改体例。"
why = "改错了形态，历史对不上，或者目标仓多一份不合体的文。"
status = "suspected"

[[axiom]]
name = "template-scope"
description = "有固定结构才有模板；结构随内容走的不设固定写法。手册、规格与按日期落的日志结构固定，可以有模板。"
why = "结构不固定还套模板，等于让模板替作者删内容。"
status = "confirmed"

