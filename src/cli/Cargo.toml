[package]
name = "qtfounder-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "qtfounder"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
