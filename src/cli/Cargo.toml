[package]
name = "qtfounder-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "qtfounder"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
quanttide-agent = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
serde_yaml = "0.9"
git2 = "0.19"
chrono = "0.4"
