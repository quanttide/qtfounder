[package]
name = "qtfounder-cli"
version = "0.0.11"
edition = "2024"

[[bin]]
name = "qtfounder"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
tree-sitter = "0.27.1"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-dart = "0.2.0"
regex = "1.13.1"
ureq = { version = "3.5.0", features = ["json"] }
serde_json = "1.0.154"
rusqlite = { version = "0.40.2", features = ["bundled"] }
quanttide-founder = { path = "../../../../packages/quanttide-founder-toolkit/packages/rust" }
