# 记忆资产契约
# 语义规则声明：一级文件夹=一类记忆（认知科学分类），二级仅 journal 有（default/），文件自由命名
asset: memory
label: 记忆
root: memory
ignore:
  - README.md
  - CHANGELOG.md
  - AGENTS.md
levels:
  - key: category
    label: 类型
  - key: folder
    label: 子目录
    optional: true
naming:
  pattern: null
  title: null
  sortKey: null
  version: null
  unsorted: natural
